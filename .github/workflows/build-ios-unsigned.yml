name: Build signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default Herdr Mobile Relay URL"
        required: false
        type: string
        default: ""
      export_method:
        description: "Xcode export method for archive signing"
        required: false
        type: string
        default: ad-hoc

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app
      EXPO_NEW_ARCH_ENABLED: "1"
      RCT_NEW_ARCH_ENABLED: "1"
      EXPO_PUBLIC_HERDR_URL: ${{ inputs.relay_url }}
      EXPO_NO_GIT_STATUS: "1"
      HERDR_IOS_BUNDLE_ID: ${{ secrets.HERDR_IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_MOBILEPROVISION_BASE64: ${{ secrets.BUILD_MOBILEPROVISION_BASE64 }}
      BUILD_MOBILEPROVISION_UUID: ${{ secrets.BUILD_MOBILEPROVISION_UUID }}
      BUILD_PROVISIONING_PROFILE_NAME: ${{ secrets.BUILD_PROVISIONING_PROFILE_NAME }}
      BUILD_SIGNING_IDENTITY: ${{ secrets.BUILD_SIGNING_IDENTITY }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        env:
          EXPO_NEW_ARCH_ENABLED: "1"
          RCT_NEW_ARCH_ENABLED: "1"
        run: pnpm exec expo prebuild --clean --platform ios

      - name: Pin Clerk iOS SDK to Swift 5.10 compatible version
        env:
          TARGET_CLERK_IOS_VERSION: "1.1.0"
        run: |
          set -euo pipefail
          updated=0
          while IFS= read -r -d '' spec; do
            if grep -q "clerk_ios_version" "$spec"; then
              perl -0777 -i -pe "s/clerk_ios_version\\s*=\\s*'[^']+'/clerk_ios_version = '$TARGET_CLERK_IOS_VERSION'/g" "$spec"
              echo "Patched $spec"
              updated=1
            fi
          done < <(find node_modules -name ClerkExpo.podspec -print0)
          if [ "$updated" -eq 0 ]; then
            echo "No ClerkExpo podspec files were patched"
          fi

      - name: Pin iOS SwiftPM package tools versions for this runner
        run: |
          set -euo pipefail
          TARGET_SWIFT_TOOLS_VERSION="6.0"
          TARGET_MANIFEST="Package.swift"
          if ! echo "$TARGET_SWIFT_TOOLS_VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Invalid TARGET_SWIFT_TOOLS_VERSION: $TARGET_SWIFT_TOOLS_VERSION" >&2
            exit 1
          fi
          echo "Pinning selected SwiftPM package tools versions to $TARGET_SWIFT_TOOLS_VERSION"
          updated=0
          manifest_count=0
          while IFS= read -r -d '' manifest; do
            manifest_count=$((manifest_count + 1))
            if grep -Eq '(^|//) swift-tools-version:\\s*[0-9]+\\.[0-9]+(?:\\.[0-9]+)?$' "$manifest" && \
               echo "$manifest" | grep -q 'expo-modules-jsi' && \
               ! grep -q "// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}" "$manifest"; then
              perl -0pi -e "s#// swift-tools-version:\\s*[0-9]+\\.[0-9]+(?:\\.[0-9]+)?#// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}#g" "$manifest"
              echo "Patched $manifest"
              updated=1
            fi
          done < <(find node_modules -L -type f -name "$TARGET_MANIFEST" -print0)
          if [ "$manifest_count" -eq 0 ]; then
            echo "No Package.swift manifests were found under node_modules."
          fi
          if [ -f ios/build/generated/ios/$TARGET_MANIFEST ]; then
            if grep -Eq '(^|//) swift-tools-version:\\s*[0-9]+\\.[0-9]+(?:\\.[0-9]+)?$' ios/build/generated/ios/$TARGET_MANIFEST && \
               ! grep -q "// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}" ios/build/generated/ios/$TARGET_MANIFEST; then
              perl -0pi -e "s#// swift-tools-version:\\s*[0-9]+\\.[0-9]+(?:\\.[0-9]+)?#// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}#g" ios/build/generated/ios/$TARGET_MANIFEST
              echo "Patched ios/build/generated/ios/$TARGET_MANIFEST"
              updated=1
            fi
          fi
          if [ "$updated" -eq 0 ]; then
            echo "No matching Package.swift manifests were patched"
          fi

      - name: Install CocoaPods dependencies
        env:
          EXPO_NEW_ARCH_ENABLED: "1"
          RCT_NEW_ARCH_ENABLED: "1"
        run: pod install --project-directory=ios --deployment

      - name: Verify signing secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HERDR_IOS_BUNDLE_ID: ${{ secrets.HERDR_IOS_BUNDLE_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_MOBILEPROVISION_BASE64: ${{ secrets.BUILD_MOBILEPROVISION_BASE64 }}
          BUILD_MOBILEPROVISION_UUID: ${{ secrets.BUILD_MOBILEPROVISION_UUID }}
          BUILD_PROVISIONING_PROFILE_NAME: ${{ secrets.BUILD_PROVISIONING_PROFILE_NAME }}
          BUILD_SIGNING_IDENTITY: ${{ secrets.BUILD_SIGNING_IDENTITY }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0

          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "Missing APPLE_TEAM_ID." >&2
            missing=1
          fi
          if [ -z "$HERDR_IOS_BUNDLE_ID" ]; then
            echo "Missing HERDR_IOS_BUNDLE_ID." >&2
            missing=1
          fi
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Missing BUILD_CERTIFICATE_BASE64." >&2
            missing=1
          fi
          if [ -z "$BUILD_MOBILEPROVISION_BASE64" ]; then
            echo "Missing BUILD_MOBILEPROVISION_BASE64." >&2
            missing=1
          fi
          if [ -z "$BUILD_MOBILEPROVISION_UUID" ]; then
            echo "Missing BUILD_MOBILEPROVISION_UUID." >&2
            missing=1
          fi
          if [ -z "$BUILD_PROVISIONING_PROFILE_NAME" ]; then
            echo "Missing BUILD_PROVISIONING_PROFILE_NAME." >&2
            missing=1
          fi
          if [ -z "$BUILD_SIGNING_IDENTITY" ]; then
            echo "Missing BUILD_SIGNING_IDENTITY." >&2
            missing=1
          fi
          if [ -z "$P12_PASSWORD" ]; then
            echo "Missing P12_PASSWORD." >&2
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Signing workflow cannot start without all required iOS signing secrets." >&2
            exit 1
          fi

      - name: Prepare build paths
        id: paths
        shell: bash
        run: |
          echo "archive=$RUNNER_TEMP/Herdr.xcarchive" >> "$GITHUB_OUTPUT"
          echo "export=$RUNNER_TEMP/herdr-export" >> "$GITHUB_OUTPUT"
          echo "certificate=$RUNNER_TEMP/build_certificate.p12" >> "$GITHUB_OUTPUT"
          echo "profile=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_OUTPUT"
          echo "profile_install=$HOME/Library/MobileDevice/Provisioning Profiles/${{ secrets.BUILD_MOBILEPROVISION_UUID }}.mobileprovision" >> "$GITHUB_OUTPUT"
          echo "export_options=$RUNNER_TEMP/export-options.plist" >> "$GITHUB_OUTPUT"

      - name: Write Apple certificates and provisioning profile
        shell: bash
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "${{ steps.paths.outputs.certificate }}"
          echo "$BUILD_MOBILEPROVISION_BASE64" | base64 --decode > "${{ steps.paths.outputs.profile }}"
          mkdir -p "$(dirname "${{ steps.paths.outputs.profile_install }}")"
          cp "${{ steps.paths.outputs.profile }}" "${{ steps.paths.outputs.profile_install }}"
          chmod 600 "${{ steps.paths.outputs.certificate }}" "${{ steps.paths.outputs.profile }}"
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_MOBILEPROVISION_BASE64: ${{ secrets.BUILD_MOBILEPROVISION_BASE64 }}

      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Resolve workspace and scheme
        id: ios-target
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace was generated" >&2
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace"
          echo "scheme=$scheme"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Archive signed app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "${{ steps.ios-target.outputs.workspace }}" \
            -scheme "${{ steps.ios-target.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ steps.paths.outputs.archive }}" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Prepare export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
          HERDR_IOS_BUNDLE_ID: ${{ secrets.HERDR_IOS_BUNDLE_ID }}
          BUILD_SIGNING_IDENTITY: ${{ secrets.BUILD_SIGNING_IDENTITY }}
          BUILD_PROVISIONING_PROFILE_NAME: ${{ secrets.BUILD_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "${{ steps.paths.outputs.export_options }}" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>signingCertificate</key>
            <string>__SIGNING_IDENTITY__</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>__BUNDLE_ID__</key>
              <string>__PROFILE_NAME__</string>
            </dict>
            <key>teamID</key>
            <string>__TEAM_ID__</string>
          </dict>
          </plist>
          PLIST

          /usr/libexec/PlistBuddy -c "Set :method $EXPORT_METHOD" "${{ steps.paths.outputs.export_options }}"
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" "${{ steps.paths.outputs.export_options }}"
          /usr/libexec/PlistBuddy -c "Set :signingCertificate $BUILD_SIGNING_IDENTITY" "${{ steps.paths.outputs.export_options }}"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles dict" "${{ steps.paths.outputs.export_options }}"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$HERDR_IOS_BUNDLE_ID string $BUILD_PROVISIONING_PROFILE_NAME" "${{ steps.paths.outputs.export_options }}"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "${{ steps.paths.outputs.export_options }}"

      - name: Export IPA
        shell: bash
        env:
          EXPO_NEW_ARCH_ENABLED: "1"
          RCT_NEW_ARCH_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.paths.outputs.export }}"
          xcodebuild -exportArchive \
            -archivePath "${{ steps.paths.outputs.archive }}" \
            -exportPath "${{ steps.paths.outputs.export }}" \
            -exportOptionsPlist "${{ steps.paths.outputs.export_options }}"

      - name: Locate signed IPA
        id: ipa
        shell: bash
        run: |
          ipa_path="$(find '${{ steps.paths.outputs.export }}' -maxdepth 2 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "No signed ipa found in ${{ steps.paths.outputs.export }}" >&2
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Upload to BrowserStack
        id: browserstack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail

          payload=$(
            cat <<'JSON'
            {
              "name": "herdr-signed-${{ github.run_number }}",
              "custom_id": "herdr-${{ github.run_id }}"
            }
            JSON
          )

          upload_response="$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@${{ steps.ipa.outputs.path }}" \
            -F "data=$payload")"

          echo "$upload_response"

          app_url="$(printf '%s' "$upload_response" | node -e "const fs=require('fs'); let d=''; process.stdin.on('data',chunk=>d+=chunk); process.stdin.on('end',()=>{try{const p=JSON.parse(d); const appUrl=p.app_url||p.appUrl||''; if(!appUrl){process.exit(1);} console.log(appUrl);}catch(e){process.exit(1);}});")"
          if [ -z "$app_url" ]; then
            echo "BrowserStack upload response did not include app_url." >&2
            exit 1
          fi

          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 7
