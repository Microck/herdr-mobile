name: Build unsigned iOS IPA

on:
  push:
    branches:
      - ios-unsigned-spm-fix
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default Herdr Mobile Relay URL"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app
      EXPO_NEW_ARCH_ENABLED: "1"
      RCT_NEW_ARCH_ENABLED: "1"
      EXPO_USE_PRECOMPILED_MODULES: "0"
      EXPO_PUBLIC_HERDR_URL: ${{ inputs.relay_url }}
      EXPO_NO_GIT_STATUS: "1"
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        env:
          EXPO_NEW_ARCH_ENABLED: "1"
          RCT_NEW_ARCH_ENABLED: "1"
        run: pnpm exec expo prebuild --clean --platform ios

      - name: Patch ExpoModulesJSI Swift sources for Xcode compatibility
        run: |
          set -euo pipefail
          set -o pipefail

          patch_sendable_file() {
            local file="$1"
            perl -0pi -e '
              s/\bweak let\b/weak var/g;
              s/(JavaScriptValuesBuffer),\s*\n\s*(\))/$1\n$2/g;
              s/Task\.immediate\(name: name, priority: priority, operation: operation\)/Task(priority: priority ?? .high, operation: operation)/g;
              s/Task\(name: name, priority: \.high, operation: operation\)/Task(priority: .high, operation: operation)/g;
              s/vector\.push_back\(consuming: propNameId\)/expo.appendPropNameId(\&vector, runtime.pointee, std.string(propertyName))/g;
              s/        let propNameId = facebook\.jsi\.PropNameID\.forUtf8\(runtime\.pointee, std\.string\(propertyName\)\)\n//g;
              s/expo\.RuntimeScheduler\(scheduler, fn\)/expo.createBoundRuntimeScheduler(scheduler, fn)/g;
              s/expo\.RuntimeScheduler\(\)/expo.createStandaloneRuntimeScheduler()/g;
              s/expo\.NativeState\(ptr, deallocate\)/expo.createNativeState(ptr, deallocate)/g;
              s/expo\.HostFunctionClosure\(context, call, deallocate\)/expo.createHostFunctionClosure(context, call, deallocate)/g;
              s/public protocol JavaScriptType: Sendable, ~Copyable/public protocol JavaScriptType: ~Copyable/g;
              s/public protocol JavaScriptRepresentable: Sendable, ~Copyable/public protocol JavaScriptRepresentable: ~Copyable/g;
              s/public final class JavaScriptValue: JavaScriptType, Equatable, Escapable, Error \{/public final class JavaScriptValue: JavaScriptType, Equatable, Escapable, Error, \@unchecked Sendable {/g;
              s/public struct PropertyOptions: OptionSet, Sendable/public struct PropertyOptions: OptionSet, @unchecked Sendable/g;
              s/public struct PropertyOptions: OptionSet \{/public struct PropertyOptions: OptionSet, @unchecked Sendable {/g;
              s/(HostFunctionContext|HostObjectContext)\s*:\s*Sendable\b/$1/g;
              s/internal final class HostFunctionContext(?:\s*:\s*(?:\@unchecked\s+)?Sendable)?/internal final class HostFunctionContext: \@unchecked Sendable/g;
              s/internal final class HostObjectContext(?:\s*:\s*(?:\@unchecked\s+)?Sendable)?/internal final class HostObjectContext: \@unchecked Sendable/g;
              s/consuming sending T/consuming T/g;
              s/public func resolve<V: JavaScriptRepresentable>\(_ value: V\)/public func resolve<V: JavaScriptRepresentable \& Sendable>(_ value: V)/g;
            ' "$file"
          }

          patched=0
          while IFS= read -r -d '' file; do
            patch_sendable_file "$file"
            patched=$((patched + 1))
          done < <(
            find . -type f -path '*/expo-modules-jsi*/apple/Sources/*' -name '*.swift' -print0
            {
              find node_modules -type f -path '*/expo-modules-jsi*/apple/Sources/*' -name '*.swift' -print0
              if [ -d "build/SourcePackages/checkouts" ]; then
                find build/SourcePackages/checkouts -type f \( -name 'JavaScriptActor.swift' -o -name 'JavaScriptValue.swift' -o -name 'HostFunctionContext.swift' -o -name 'HostObjectContext.swift' -o -name 'JavaScriptRuntime.swift' \) -print0
              fi
              if [ -d "build/DerivedData/SourcePackages/checkouts" ]; then
                find build/DerivedData/SourcePackages/checkouts -type f \( -name 'JavaScriptActor.swift' -o -name 'JavaScriptValue.swift' -o -name 'HostFunctionContext.swift' -o -name 'HostObjectContext.swift' -o -name 'JavaScriptRuntime.swift' \) -print0
              fi
              if [ -d "$HOME/Library/Developer/Xcode/DerivedData" ]; then
                while IFS= read -r -d '' checkout_root; do
                  find "$checkout_root" -type f \( -name 'JavaScriptActor.swift' -o -name 'JavaScriptValue.swift' -o -name 'HostFunctionContext.swift' -o -name 'HostObjectContext.swift' -o -name 'JavaScriptRuntime.swift' \) -print0
                done < <(find -L "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/SourcePackages/checkouts' -print0 2>/dev/null)
              fi
            } | sort -z -u
          )
          echo "Patched $patched ExpoModulesJSI Swift source files."

      - name: Pin Clerk iOS SDK to Swift 5.10 compatible version
        env:
          TARGET_CLERK_IOS_VERSION: "1.3.3"
        run: |
          set -euo pipefail
          updated=0
          while IFS= read -r -d '' spec; do
            if grep -q "clerk_ios_version" "$spec"; then
              perl -0777 -i -pe "s/clerk_ios_version\\s*=\\s*'[^']+'/clerk_ios_version = '$TARGET_CLERK_IOS_VERSION'/g" "$spec"
              echo "Patched $spec"
              updated=1
            fi
            done < <(find node_modules -name ClerkExpo.podspec -print0)
            if [ "$updated" -eq 0 ]; then
              echo "No ClerkExpo podspec files were patched"
            fi

            clerk_ios_local_path="$RUNNER_TEMP/clerk-ios-$TARGET_CLERK_IOS_VERSION"
            rm -rf "$clerk_ios_local_path"
            git clone --depth 1 --branch "$TARGET_CLERK_IOS_VERSION" \
              https://github.com/clerk/clerk-ios.git "$clerk_ios_local_path"
            while IFS= read -r -d '' manifest; do
              perl -0pi -e \
                's#// swift-tools-version:\s*[0-9]+\.[0-9]+(?:\.[0-9]+)?#// swift-tools-version: 6.0#; s/,\s*\]/]/g; s/,\s*\)/)/g' \
                "$manifest"
            done < <(find "$clerk_ios_local_path" -type f -name Package.swift -print0)
            git -C "$clerk_ios_local_path" add Package.swift
            git -C "$clerk_ios_local_path" \
              -c user.name=CI -c user.email=ci@example.com \
              commit -m "ci: use Swift 6.0 package manifest" >/dev/null
            while IFS= read -r -d '' spec; do
              perl -0777 -i -pe \
                "s#clerk_ios_repo = 'https://github.com/clerk/clerk-ios.git'#clerk_ios_repo = 'file://$clerk_ios_local_path'#g" \
                "$spec"
              echo "Using local patched Clerk iOS package for $spec"
            done < <(find node_modules -name ClerkExpo.podspec -print0)

      - name: Install CocoaPods dependencies
        env:
          EXPO_NEW_ARCH_ENABLED: "1"
          RCT_NEW_ARCH_ENABLED: "1"
        run: pod install --project-directory=ios --deployment

      - name: Prepare build paths
        id: paths
        shell: bash
        run: |
          echo "archive=$RUNNER_TEMP/Herdr.xcarchive" >> "$GITHUB_OUTPUT"
          echo "ipa=$RUNNER_TEMP/Herdr-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: Resolve workspace and scheme
        id: ios-target
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [[ -z "$workspace" ]]; then
            echo "No Xcode workspace was generated" >&2
            exit 1
          fi

          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace"
          echo "scheme=$scheme"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      - name: Resolve SwiftPM dependencies and patch if needed
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          WORKSPACE="${{ steps.ios-target.outputs.workspace }}"
          SCHEME="${{ steps.ios-target.outputs.scheme }}"
          TARGET_SWIFT_TOOLS_VERSION="6.0"
          TARGET_MANIFEST="Package.swift"
          RESOLVE_LOG="$RUNNER_TEMP/swiftpm-resolve.log"

          manifest_count=0
          updated=0

          normalize_manifest() {
            local manifest="$1"
            perl -0pi -e 's/,\s*\]/]/g; s/,\s*\)/)/g' "$manifest"
            echo "Normalized SwiftPM manifest syntax for $manifest"
          }

          scan_manifests() {
            local root="$1"
            if [ ! -d "$root" ]; then
              return 0
            fi
            while IFS= read -r -d '' manifest; do
              manifest_count=$((manifest_count + 1))
              if grep -Eq ',[[:space:]]*\]|,[[:space:]]*\)' "$manifest"; then
                normalize_manifest "$manifest"
                updated=1
              fi
              if grep -Eq '^[[:space:]]*//[[:space:]]*swift-tools-version:[[:space:]]*6\.[0-9]+(\.[0-9]+)?$' "$manifest" && \
                 ! grep -q "// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}" "$manifest"; then
                perl -0pi -e "s#// swift-tools-version:\\s*[0-9]+\\.[0-9]+(?:\\.[0-9]+)?#// swift-tools-version: ${TARGET_SWIFT_TOOLS_VERSION}#g" "$manifest"
                echo "Patched $manifest"
                updated=1
              fi
            done < <(find -L "$root" -type f -name "$TARGET_MANIFEST" -print0)
          }

          patch_swiftpm_manifests() {
            scan_manifests "node_modules"
            scan_manifests "ios"
            scan_manifests "build/SourcePackages/checkouts"
            scan_manifests "build/DerivedData/SourcePackages/checkouts"
            if [ -d "$HOME/Library/Developer/Xcode/DerivedData" ]; then
              while IFS= read -r -d '' checkout_root; do
                scan_manifests "$checkout_root"
              done < <(find -L "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/SourcePackages/checkouts' -print0 2>/dev/null)
            fi
          }

          run_resolve() {
            xcodebuild -resolvePackageDependencies \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -derivedDataPath "$PWD/build/DerivedData" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY= \
              >"$RESOLVE_LOG" 2>&1
          }

          patch_swiftpm_manifests
          if [ "$updated" -eq 0 ]; then
            echo "No Package.swift manifest versions were updated before initial resolve."
          fi

          echo "Running initial SwiftPM resolve pass (with no-sign config)."
          if ! run_resolve; then
            if ! grep -Eq 'package .* is using Swift tools version 6\.2\.0|contains incompatible tools version \(6\.2\.0\)' "$RESOLVE_LOG"; then
              cat "$RESOLVE_LOG" >&2
              exit 1
            fi

            echo "Known SwiftPM tools-version mismatch detected, patching Package.swift manifests and retrying."
            manifest_count=0
            updated=0
            patch_swiftpm_manifests
            if [ "$updated" -eq 0 ]; then
              echo "No matching Package.swift manifests were patched."
            fi

            if ! run_resolve; then
              cat "$RESOLVE_LOG" >&2
              exit 1
            fi
          fi

      - name: Reapply ExpoModulesJSI Swift compatibility patch before archive
        shell: bash
        run: |
          set -euo pipefail

          patched=0
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s/\bweak let\b/weak var/g;
              s/(JavaScriptValuesBuffer),\s*\n\s*(\))/$1\n$2/g;
              s/Task\.immediate\(name: name, priority: priority, operation: operation\)/Task(priority: priority ?? .high, operation: operation)/g;
              s/Task\(name: name, priority: \.high, operation: operation\)/Task(priority: .high, operation: operation)/g;
              s/vector\.push_back\(consuming: propNameId\)/expo.appendPropNameId(\&vector, runtime.pointee, std.string(propertyName))/g;
              s/        let propNameId = facebook\.jsi\.PropNameID\.forUtf8\(runtime\.pointee, std\.string\(propertyName\)\)\n//g;
              s/expo\.RuntimeScheduler\(scheduler, fn\)/expo.createBoundRuntimeScheduler(scheduler, fn)/g;
              s/expo\.RuntimeScheduler\(\)/expo.createStandaloneRuntimeScheduler()/g;
              s/expo\.NativeState\(ptr, deallocate\)/expo.createNativeState(ptr, deallocate)/g;
              s/expo\.HostFunctionClosure\(context, call, deallocate\)/expo.createHostFunctionClosure(context, call, deallocate)/g;
              s/public protocol JavaScriptType: Sendable, ~Copyable/public protocol JavaScriptType: ~Copyable/g;
              s/public protocol JavaScriptRepresentable: Sendable, ~Copyable/public protocol JavaScriptRepresentable: ~Copyable/g;
              s/public final class JavaScriptValue: JavaScriptType, Equatable, Escapable, Error \{/public final class JavaScriptValue: JavaScriptType, Equatable, Escapable, Error, \@unchecked Sendable {/g;
              s/public struct PropertyOptions: OptionSet, Sendable/public struct PropertyOptions: OptionSet, \@unchecked Sendable/g;
              s/public struct PropertyOptions: OptionSet \{/public struct PropertyOptions: OptionSet, \@unchecked Sendable {/g;
              s/(HostFunctionContext|HostObjectContext)\s*:\s*Sendable\b/$1/g;
              s/internal final class HostFunctionContext(?:\s*:\s*(?:\@unchecked\s+)?Sendable)?/internal final class HostFunctionContext: \@unchecked Sendable/g;
              s/internal final class HostObjectContext(?:\s*:\s*(?:\@unchecked\s+)?Sendable)?/internal final class HostObjectContext: \@unchecked Sendable/g;
              s/consuming sending T/consuming T/g;
              s/public func resolve<V: JavaScriptRepresentable>\(_ value: V\)/public func resolve<V: JavaScriptRepresentable \& Sendable>(_ value: V)/g;
            ' "$file"
            patched=$((patched + 1))
          done < <(find node_modules -type f -path '*/expo-modules-jsi*/apple/Sources/*' -name '*.swift' -print0)
          header_patched=0
          while IFS= read -r -d '' header; do
            case "$header" in
              *NativeState.h)
                perl -0pi -e 's~} SWIFT_IMMORTAL_REFERENCE; // class NativeState\n\n} // namespace expo~} SWIFT_IMMORTAL_REFERENCE; // class NativeState\n\ninline NativeState *createNativeState(NativeState::Context context, NativeState::Deallocator deallocator) {\n  return new NativeState(context, deallocator);\n}\n\n} // namespace expo~' "$header"
                ;;
              *RuntimeScheduler.h)
                perl -0pi -e 's~} SWIFT_SHARED_REFERENCE\(retainRuntimeScheduler, releaseRuntimeScheduler\);\n\n} // namespace expo~} SWIFT_SHARED_REFERENCE(retainRuntimeScheduler, releaseRuntimeScheduler);\n\ninline RuntimeScheduler *createStandaloneRuntimeScheduler() {\n  return new RuntimeScheduler();\n}\n\ninline RuntimeScheduler *createBoundRuntimeScheduler(void *scheduler, RuntimeScheduler::ScheduleFn fn) {\n  return new RuntimeScheduler(scheduler, fn);\n}\n\n} // namespace expo~' "$header"
                ;;
              *HostFunctionClosure.h)
                perl -0pi -e 's~#include <jsi/jsi.h>~#include <jsi/jsi.h>\n#include <vector>~' "$header"
                perl -0pi -e 's~} SWIFT_IMMORTAL_REFERENCE; // class HostFunctionClosure\n\n} // namespace expo~} SWIFT_IMMORTAL_REFERENCE; // class HostFunctionClosure\n\ninline HostFunctionClosure *createHostFunctionClosure(HostFunctionClosure::Context context, HostFunctionClosure::Closure closure, HostFunctionClosure::Deallocator deallocator) {\n  return new HostFunctionClosure(context, closure, deallocator);\n}\n\ninline void appendPropNameId(std::vector<facebook::jsi::PropNameID> *propNameIds, facebook::jsi::Runtime *runtime, std::string propertyName) {\n  propNameIds->push_back(facebook::jsi::PropNameID::forUtf8(*runtime, propertyName));\n}\n\n} // namespace expo~' "$header"
                ;;
            esac
            header_patched=$((header_patched + 1))
          done < <(find node_modules -type f -path '*/expo-modules-jsi*/apple/Sources/ExpoModulesJSI-Cxx/include/*.h' -print0)
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s~    if \(\@available\(iOS 26\.0, \*\)\) \{\n      navitem\.subtitle = config\.subtitle;\n      navitem\.largeSubtitle = config\.largeSubtitle;\n    \}~#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 260000\n    if (\@available(iOS 26.0, *)) {\n      navitem.subtitle = config.subtitle;\n      navitem.largeSubtitle = config.largeSubtitle;\n    }\n#endif~g;
              s~  if \(\@available\(iOS 26\.0, \*\)\) \{\n    navitem\.subtitle = config\.subtitle;\n    navitem\.largeSubtitle = config\.largeSubtitle;\n  \}~#if __IPHONE_OS_VERSION_MAX_ALLOWED >= 260000\n  if (\@available(iOS 26.0, *)) {\n    navitem.subtitle = config.subtitle;\n    navitem.largeSubtitle = config.largeSubtitle;\n  }\n#endif~g;
            ' "$file"
          done < <(find node_modules -type f -path '*/react-native-screens/ios/RNSScreenStackHeaderConfig.mm' -print0)

          if [ "$header_patched" -lt 3 ]; then
            echo "Expected ExpoModulesJSI C++ bridge headers were not found" >&2
            exit 1
          fi
          if [ "$patched" -eq 0 ]; then
            echo "No ExpoModulesJSI Swift sources found in node_modules" >&2
            exit 1
          fi
          echo "Reapplied ExpoModulesJSI patch to $patched Swift source files."

      - name: Patch ExpoModulesCore Swift sources for Xcode compatibility
        shell: bash
        run: |
          set -euo pipefail

          core_patched=0
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s/\bweak let\b/weak var/g;
              s/^\s*\@MainActor\s*\n//mg;
              s/\@MainActor\s+//g;
              if (/\bMainActor\b/ && !/^import _Concurrency\b/m) {
                s/\A/import _Concurrency\n/;
              }
            ' "$file"
            core_patched=$((core_patched + 1))
          done < <(find node_modules -type f -path '*/expo-modules-core/ios/Core/*' -name '*.swift' -print0)

          notification_patched=0
          while IFS= read -r -d '' file; do
            perl -0pi -e 's/^\s*serializedComponents\["isRepeatedDay"\] = dateComponents\.isRepeatedDay \?\? false\s*\n//mg' "$file"
            notification_patched=$((notification_patched + 1))
          done < <(find node_modules -type f -path '*/expo-notifications/ios/ExpoNotifications/Notifications/DateComponentsSerializer.swift' -print0)

          image_picker_patched=0
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s/asset\?\.contentType \?\? UTType\(filenameExtension: fileExtension\)/UTType(filenameExtension: fileExtension)/g;
              s/resource\.contentType/UTType(resource.uniformTypeIdentifier) ?? UTType(filenameExtension: fileExtension)/g;
            ' "$file"
            image_picker_patched=$((image_picker_patched + 1))
          done < <(find node_modules -type f -path '*/expo-image-picker/ios/MediaHandler.swift' -print0)

          expo_image_patched=0
          while IFS= read -r -d '' file; do
            perl -0pi -e '
              s/sdImageView\.addSymbolEffect\(\.drawOn\.byLayer, options: options\)/break/g;
              s/sdImageView\.addSymbolEffect\(\.drawOn\.wholeSymbol, options: options\)/break/g;
              s/sdImageView\.addSymbolEffect\(\.drawOn, options: options\)/break/g;
              s/sdImageView\.addSymbolEffect\(\.drawOff\.byLayer, options: options\)/break/g;
              s/sdImageView\.addSymbolEffect\(\.drawOff\.wholeSymbol, options: options\)/break/g;
              s/sdImageView\.addSymbolEffect\(\.drawOff, options: options\)/break/g;
            ' "$file"
            expo_image_patched=$((expo_image_patched + 1))
          done < <(find node_modules -type f -path '*/expo-image/ios/ImageView.swift' -print0)

          if [ "$core_patched" -eq 0 ]; then
            echo "No ExpoModulesCore Swift sources found in node_modules" >&2
            exit 1
          fi
          if [ "$notification_patched" -eq 0 ]; then
            echo "No Expo notifications date serializer found in node_modules" >&2
            exit 1
          fi
          if [ "$image_picker_patched" -eq 0 ]; then
            echo "No Expo image picker media handler found in node_modules" >&2
            exit 1
          fi
          if [ "$expo_image_patched" -eq 0 ]; then
            echo "No Expo image view found in node_modules" >&2
            exit 1
          fi
          echo "Patched ExpoModulesCore Swift sources in $core_patched files."

      - name: Archive unsigned app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "${{ steps.ios-target.outputs.workspace }}" \
            -scheme "${{ steps.ios-target.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${{ steps.paths.outputs.archive }}" \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            SWIFT_VERSION=5.9 \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: Create unsigned IPA
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find "${{ steps.paths.outputs.archive }}/Products/Applications" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            app_path="$(find "${{ steps.paths.outputs.archive }}" -maxdepth 6 -type d -name '*.app' -print -quit)"
          fi
          if [ -z "$app_path" ]; then
            echo "No .app bundle was produced in the archive." >&2
            exit 1
          fi

          unsigned_payload="$(mktemp -d)"
          mkdir -p "$unsigned_payload/Payload"
          cp -R "$app_path" "$unsigned_payload/Payload/"
          (cd "$unsigned_payload" && zip -qry "${{ steps.paths.outputs.ipa }}" Payload)
          echo "path=${{ steps.paths.outputs.ipa }}" >> "$GITHUB_OUTPUT"

      - name: Upload to BrowserStack
        id: browserstack
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -euo pipefail

          payload=$(
            cat <<'JSON'
            {
              "name": "herdr-unsigned-${{ github.run_number }}",
              "custom_id": "herdr-${{ github.run_id }}"
            }
            JSON
          )

          upload_response="$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@${{ steps.ipa.outputs.path }}" \
            -F "data=$payload")"

          echo "$upload_response"

          app_url="$(printf '%s' "$upload_response" | node -e "const fs=require('fs'); let d=''; process.stdin.on('data',chunk=>d+=chunk); process.stdin.on('end',()=>{try{const p=JSON.parse(d); const appUrl=p.app_url||p.appUrl||''; if(!appUrl){process.exit(1);} console.log(appUrl);}catch(e){process.exit(1);}});")"
          if [ -z "$app_url" ]; then
            echo "BrowserStack upload response did not include app_url." >&2
            exit 1
          fi

          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 7
